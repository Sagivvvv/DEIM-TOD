__include__: [
  '../dataset/tinyperson_detection.yml',   # TinyPerson：路径 + 标准 CocoEvaluator + num_classes=3
  '../runtime.yml',
  '../base/dataloader.yml',           # Resize=800、base_size=800 继承 base（与 aitod 共用）
  '../base/optimizer.yml',
  '../base/dfine_hgnetv2.yml',        # eval_spatial_size=800 继承 base
]

output_dir: ./output/dfine_hgnetv2_s_tinyperson

# ==================== D-FINE-S 模型结构（与官方 dfine_hgnetv2_s_coco.yml 一致）====================
DEIM:
  backbone: HGNetv2

HGNetv2:
  name: 'B0'
  return_idx: [1, 2, 3]
  freeze_at: -1
  freeze_norm: False
  use_lab: True
  # pretrained 权重自动下载：训练前先 source /etc/network_turbo 开学术加速

DFINETransformer:
  num_layers: 3    # D-FINE-S 用 3 层解码器
  eval_idx: -1

HybridEncoder:
  in_channels: [256, 512, 1024]
  hidden_dim: 256
  depth_mult: 0.34
  expansion: 0.5

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*norm|bn).*$'
      lr: 0.0001
    -
      params: '^(?=.*backbone)(?=.*norm|bn).*$'
      lr: 0.0001
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0001

# ==================== 训练配方（D-FINE-S 官方 132 epoch；train 仅 746 张，数据小可加 epoches 并同比调 stop/policy）====================
epoches: 132

train_dataloader:
  total_batch_size: 8      # 单卡；OOM 降到 4
  num_workers: 8
  dataset:
    transforms:
      policy:
        epoch: 120         # 前 120 epoch 强增强，之后关掉（ops 链继承 base，Resize=800）
  collate_fn:
    # 自定义多尺度：800 占 50%、其余各 12.5%；全部 32 对齐
    scales: [640, 736, 800, 800, 800, 800, 864, 960]
    stop_epoch: 120        # 到 120 触发两阶段（载 best_stg1.pth + 重启 EMA）；切勿设 0
    ema_restart_decay: 0.9999

val_dataloader:
  total_batch_size: 16
  num_workers: 8
